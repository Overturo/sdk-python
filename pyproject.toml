[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overturo"
version = "1.0.0"
description = "Overturo SDK — authorize, oversight, and decisions for backend integrators"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Overturo", email = "sdk@overturo.com" }]
keywords = [
  "overturo",
  "oap",
  "agent-authorization",
  "agent",
  "ai-agent",
  "consent",
  "oversight",
  "attestation",
  "decisions",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
lint = ["ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://developer.overturo.com/sdks/python"
Repository = "https://github.com/overturo/sdk-python"
Issues = "https://github.com/overturo/sdk-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/overturo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The conformance suite (tests/conformance/) is opt-in: it requires a
# running Overturo server and is gated by OVERTURO_BASE_URL. Default runs
# stay in unit-test territory; opt in with:
#   OVERTURO_BASE_URL=https://… pytest tests/conformance
addopts = "--ignore=tests/conformance"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
# Conformance suite is loosely-typed scaffolding talking to a live server;
# integration/ and examples/ are demo code held to a lower bar.
extend-exclude = ["tests/conformance", "integration", "examples"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Strict mode on the consolidated surface (the modules the
# parity guard used to cover) plus the new unified errors / models.
module = [
  "overturo.errors",
  "overturo.models",
  "overturo.decisions.client",
  "overturo.records",
  "overturo.receipts.client",
]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["httpx.*", "cryptography.*", "respx.*"]
ignore_missing_imports = true
